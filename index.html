<!DOCTYPE html>
<!--
  Focus Tasks for your phone.
  Reads and writes the same files Focus uses in your OneDrive "Focus" folder
  (task-bin.json, resolved-tasks.json, projects.json), so phone and computers stay in step.
  Hardened version: no outside code, sign-in remembered on this phone only, and only Focus's
  three task files can be read or written. Setup: put your Application (client) ID in config.js.
  It talks only to Microsoft sign-in and Microsoft's OneDrive service, as you.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Hardening: this page may only load its own files and talk to Microsoft sign-in and OneDrive. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://login.microsoftonline.com https://login.live.com https://graph.microsoft.com https://*.sharepoint.com https://*.1drv.com https://*.livefilestore.com https://*.microsoftpersonalcontent.com; frame-src https://login.microsoftonline.com https://login.live.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF9F7">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Focus Tasks</title>
<style>
  :root {
    --bg: #FAF9F7; --panel: #FFFFFF; --panel2: #F4F2EF; --line: #ECEAE6;
    --text: #202020; --muted: #7A7A7A; --accent: #DC4C3E; --tint: #FCEDEB;
    --high: #D1453B; --normal: #9A9A9A; --low: #CFCFCF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1E1E; --panel: #262626; --panel2: #2E2E2E; --line: #333333;
            --text: #E8E8E8; --muted: #9C9C9C; --accent: #E5604F; --tint: #3A2420;
            --high: #E5604F; --normal: #8A8A8A; --low: #555555; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 14px 14px 130px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 24px; margin: 0; flex: 1; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; font-weight: 700; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 0; border-radius: 9px; padding: 9px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.icon { background: transparent; padding: 8px 10px; color: var(--muted); font-size: 18px; }
  button.link { background: transparent; color: var(--accent); padding: 6px 8px; }
  .stats { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
  .stats b { color: var(--text); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
  .tabs button { white-space: nowrap; }
  .tabs button[aria-pressed="true"] { background: var(--tint); color: var(--accent); font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .chips button { font-size: 13px; padding: 6px 11px; white-space: nowrap; border-radius: 20px; }
  .chips button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
                            border-radius: 9px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 80px; resize: vertical; }
  #search { margin-bottom: 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--normal); background: transparent;
           padding: 0; margin-top: 1px; display: grid; place-items: center; color: transparent; font-size: 12px; }
  .check.high { border-color: var(--high); } .check.low { border-color: var(--low); }
  .check.done { background: var(--muted); border-color: var(--muted); color: #fff; }
  .body { flex: 1; min-width: 0; cursor: pointer; }
  .title { word-break: break-word; }
  .details { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .details.overdue { color: var(--high); }
  h2 { font-size: 14px; margin: 18px 0 4px; color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .status { color: var(--muted); font-size: 12px; text-align: center; min-height: 16px; margin-top: 12px; }
  .status.error { color: var(--high); }
  .center { text-align: center; margin-top: 70px; }
  .hidden { display: none !important; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: -4px 0 10px; }
  .dots span { width: 7px; height: 7px; border-radius: 4px; background: var(--line); cursor: pointer; }
  .dots span.on { background: var(--accent); }
  .addbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .addbar form { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; }
  .addbar small { display: block; max-width: 680px; margin: 4px auto 0; color: var(--muted); font-size: 11px; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet .card { background: var(--panel); width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto;
                 border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .card label { display: block; color: var(--muted); font-size: 13px; margin: 12px 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { padding: 7px 12px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--tint); color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .steps li span { flex: 1; }
  .sheetbar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 8px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; background: var(--text); color: var(--bg);
           padding: 9px 16px; border-radius: 20px; font-size: 14px; z-index: 20; }

  /* Themes (light or dark follows the phone) */
  :root[data-theme="mono"] { --bg: #FAFAFA; --panel: #FFFFFF; --panel2: #F1F1F1; --line: #E2E2E2; --text: #111111; --muted: #6E6E6E;
    --accent: #111111; --tint: #E6E6E6; --high: #111111; --normal: #8C8C8C; --low: #C9C9C9; }
  :root[data-theme="calm"] { --bg: #F6F5F1; --panel: #FFFFFF; --panel2: #EEF1EC; --line: #E2E5DF; --text: #2C3A3A; --muted: #6F7D7B;
    --accent: #4F8A86; --tint: #E3EFEC; --high: #D9776A; --normal: #93A39F; --low: #C8D1CE; }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="mono"] { --bg: #111111; --panel: #1B1B1B; --panel2: #242424; --line: #2E2E2E; --text: #F2F2F2; --muted: #9A9A9A;
      --accent: #F2F2F2; --tint: #333333; --high: #F2F2F2; --normal: #8A8A8A; --low: #4A4A4A; }
    :root[data-theme="calm"] { --bg: #1C2326; --panel: #232C30; --panel2: #2A3439; --line: #33403F; --text: #E3EAE8; --muted: #95A5A2;
      --accent: #7BB5AE; --tint: #2C403E; --high: #E39286; --normal: #7F908D; --low: #4B5A58; }
  }
  :root[data-theme="mono"] button.primary { color: var(--bg); }
  /* Tasks as soft cards */
  li.task { background: var(--panel2); border: 0; border-radius: 10px; margin-bottom: 6px; padding: 11px 12px; }
  .projectbar { display: flex; align-items: center; gap: 6px; margin: -2px 0 10px; font-size: 18px; }
  .menurow { display: flex; align-items: center; gap: 4px; padding: 12px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .menurow .count { margin-left: auto; color: var(--muted); font-size: 13px; }
  /* The calendar sheet */
  .calhead { display: flex; align-items: center; justify-content: space-between; font-size: 17px; }
  .calbar { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
  .switch { display: flex !important; align-items: center; gap: 6px; margin: 0 !important; color: var(--text) !important; font-size: 14px !important; }
  .switch input { width: auto; }
  .callist { display: flex; flex-direction: column; gap: 6px; }
  .cal { display: flex; gap: 10px; padding: 9px 10px; border-radius: 10px; background: var(--panel2); border-left: 4px solid var(--normal); }
  .cal.meeting { border-left-color: #246FE0; } .cal.focus { border-left-color: var(--accent); } .cal.break { border-left-color: #058527; opacity: .8; }
  .cal.free { opacity: .55; }
  .cal .when { width: 66px; flex: none; font-size: 13px; color: var(--muted); }
  .cal .what { flex: 1; } .cal .what small { display: block; color: var(--high); font-size: 12px; margin-top: 2px; }
  .nowline { border-top: 2px solid var(--high); margin: 2px 0; position: relative; }
  .nowline span { position: absolute; right: 0; top: -10px; background: var(--panel); color: var(--high); font-size: 11px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">✓</div>
    <h1>Tasks</h1>
    <button class="icon hidden" id="projectsBtn" aria-label="Projects">☰</button>
    <button class="icon hidden" id="calBtn" aria-label="Calendar">📅</button>
    <button class="icon" id="searchBtn" aria-label="Search">⌕</button>
    <button class="icon" id="refresh" aria-label="Refresh">⟳</button>
    <button class="icon hidden" id="menuBtn" aria-label="Menu">⋯</button>
  </header>
  <div class="dots" id="pageDots" aria-label="Pages: Tasks and Personal"><span class="on" role="button" aria-label="Tasks"></span><span role="button" aria-label="Personal"></span></div>

  <section id="signedOut" class="center hidden">
    <p>Sign in with the Microsoft account your Focus folder is in.</p>
    <button class="primary" id="signin">Sign in</button>
  </section>

  <section id="app" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs">
      <button data-view="today" aria-pressed="true">Today</button>
      <button data-view="all" aria-pressed="false">All</button>
      <button data-view="upcoming" aria-pressed="false">Upcoming</button>
      <button data-view="undated" aria-pressed="false">Undated</button>
      <button data-view="done" aria-pressed="false">Done</button>
    </div>
    <div id="projectBar" class="projectbar hidden"><button class="link" id="projectBack">‹ All</button><b id="projectTitle"></b></div>
    <input id="search" class="hidden" placeholder="Search tasks, tags and notes" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <p class="status" id="status"></p>
</main>

<div class="addbar hidden" id="addbar">
  <form id="addForm">
    <input id="newTask" placeholder="Add a task" autocomplete="off" enterkeyhint="done">
    <button class="primary" type="submit">Add</button>
  </form>
  <small>Try: Call Sam friday at 3pm #Client @calls !   or   Pay rent every month on the 1st</small>
</div>

<div class="sheet hidden" id="sheet"><div class="card" id="sheetCard"></div></div>

<script src="msal-browser.min.js" integrity="sha384-OJTwghM0Gh3Zc+gmd6l0lz1pFw9KuHHq0mSEZgmQEKgMnuSWWDb3bU9KzuD7w2hU"></script>
<script src="config.js"></script>
<script src="logic.js" integrity="sha384-gbWf4y28NKLsc6JWbc0e16W5wHOidj3v+meS+gL08JZHjEmqksM3VnCr+oU8cPXK"></script>
<script src="app.js" integrity="sha384-Q0RcmRyjYyALpgn/NZN/ttP+o/RyIgBPuJdOihaiF2/QsQNKHZh/441r+UGSRd3S"></script>
</body>
</html>
